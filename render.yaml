services:
  - type: web
    name: bot-whatsapp
    env: node
    buildCommand: npm install
    startCommand: node bot.js
    envVars:
      - key: DATA_DIR
        value: /data
      - key: MAKE_WEBHOOK
        sync: false
      - key: MAKE_WEBHOOK_VENDIDO
        sync: false
      - key: WHATSAPP_ALERTA
        sync: false
      - key: ACRESCIMO
        sync: false
      - key: HORA_AVISO
        sync: false
      - key: MINUTO_AVISO
        sync: false
      - key: GRUPO_ORIGEM_NOME
        sync: false
      - key: GRUPO_DESTINO_NOME
        sync: false
      - key: GRUPO_AVISO_NOME
        sync: false
    disk:
      name: whatsapp-data
      mountPath: /data
      sizeGB: 1
